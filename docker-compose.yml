# One-command on-premises HRMS stack.
#   cp .env.example .env && docker compose up -d --build
# Entry point: http://localhost  (SPA)   http://localhost/swagger-ui  (API docs)
name: hrms

x-api-environment: &api-environment
  DATABASE_URL: postgres://hrms:${POSTGRES_PASSWORD:-hrms_dev_password}@postgres:5432/hrms
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-before-production-32chars}
  JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-480}
  BIND_ADDR: 0.0.0.0:8080
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
  ORG_NAME: ${ORG_NAME:-Nimbus Contact Solutions Pvt Ltd}
  ORG_TAN: ${ORG_TAN:-BLRN12345E}
  PF_ESTABLISHMENT_CODE: ${PF_ESTABLISHMENT_CODE:-KN/BNG/0045678}
  ESI_ESTABLISHMENT_CODE: ${ESI_ESTABLISHMENT_CODE:-53000123450000199}
  SEED_PASSWORD: ${SEED_PASSWORD:-ChangeMe#2026}
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-hrms}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-hrmsadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-hrms_dev_password}
  S3_REGION: ap-south-1
  RUST_LOG: ${RUST_LOG:-info,hrms_api=debug,sqlx=warn}
  TZ: Asia/Kolkata

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrms_dev_password}
      POSTGRES_DB: hrms
      TZ: Asia/Kolkata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hrms"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hrmsadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hrms_dev_password}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set none local/$${S3_BUCKET} &&
      echo 'bucket ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hrmsadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hrms_dev_password}
      S3_BUCKET: ${S3_BUCKET:-hrms}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["/usr/local/bin/hrms-seed"]
    environment: *api-environment
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
