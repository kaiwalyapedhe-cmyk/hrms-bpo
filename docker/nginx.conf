# Edge reverse proxy: SPA at /, API + WebSocket + Swagger at /api, /ws, /swagger-ui.
upstream hrms_api { server api:8080; }
upstream hrms_web { server web:80; }

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 32m;

    # WebSocket dashboard (token passed as query parameter).
    location /ws/ {
        proxy_pass http://hrms_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://hrms_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /swagger-ui {
        proxy_pass http://hrms_api;
        proxy_set_header Host $host;
    }

    location = /api-doc/openapi.json {
        proxy_pass http://hrms_api;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://hrms_api;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://hrms_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
