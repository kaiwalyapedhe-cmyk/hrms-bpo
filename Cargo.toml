[workspace]
resolver = "2"
members = ["crates/core", "crates/api", "crates/web", "crates/seed"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
hrms-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
rust_decimal = { version = "1", features = ["serde-with-float", "serde-with-str"] }
toml = "0.8"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "macros",
  "chrono",
  "uuid",
  "json",
  "migrate",
  "rust_decimal",
] }
jsonwebtoken = "9"
argon2 = "0.5"
validator = { version = "0.20", features = ["derive"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid", "decimal_float", "preserve_order"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
printpdf = "0.7"
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls"] }
csv = "1"
dotenvy = "0.15"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
mime_guess = "2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
strip = "symbols"
